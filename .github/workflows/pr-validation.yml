name: PR validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modeller-agents
        uses: actions/checkout@v4
        with:
          path: modeller-agents
          persist-credentials: false

      # The source tree explicitly supports these sibling checkouts during local
      # development. Keep them adjacent so the tests exercise that lookup path.
      - name: Check out modeller-pipelines contract v1.2
        uses: actions/checkout@v4
        with:
          repository: AItlantis/modeller-pipelines
          ref: dbd00cb1299f3f68add0e5971e6ec808f010059d
          path: modeller-pipelines
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: >-
          python -m pip install
          pytest==8.3.5 PyYAML==6.0.2 build==1.2.2 hatchling==1.27.0

      - name: Run test suite
        working-directory: modeller-agents
        # The vault consumer tests use a sanitized in-repo export fixture;
        # public and fork PRs do not need credentials for modelling-knowledge.
        run: python -m pytest -q

      - name: Run advisory doctor
        working-directory: modeller-agents
        run: python -m modeller.cli doctor --root . --json
        env:
          PYTHONPATH: src

      # Strict readiness is deliberately diagnostic here. The committed baseline
      # still has planned/unpinned vendors, draft packs and a planned backend;
      # preserve its output as review evidence until those blockers are resolved.
      - name: Capture strict readiness diagnostics
        if: always()
        working-directory: modeller-agents
        shell: bash
        run: |
          mkdir -p ci-evidence
          set +e
          PYTHONPATH=src python -m modeller.cli doctor --root . --strict --json > ci-evidence/doctor-strict.json 2>&1
          echo "$?" > ci-evidence/doctor-strict.exit-code
          PYTHONPATH=src python -m modeller.cli readiness --root . --json > ci-evidence/readiness.json 2>&1
          echo "$?" > ci-evidence/readiness.exit-code

      - name: Build wheel and record SHA-256
        working-directory: modeller-agents
        run: |
          python -m build --no-isolation --wheel --outdir dist
          sha256sum dist/*.whl > dist/SHA256SUMS

      - name: Upload wheel and CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modeller-agents-${{ github.sha }}
          path: |
            modeller-agents/dist/*.whl
            modeller-agents/dist/SHA256SUMS
            modeller-agents/ci-evidence/doctor-strict.json
            modeller-agents/ci-evidence/doctor-strict.exit-code
            modeller-agents/ci-evidence/readiness.json
            modeller-agents/ci-evidence/readiness.exit-code
          if-no-files-found: warn
