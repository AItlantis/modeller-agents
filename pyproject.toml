[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeller_memory"
version = "0.0.0"
description = "Embeddable memory subsystem for the modelling ecosystem (host-agnostic tooling included)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
]

# NOTE: pydantic is intentionally NOT a dependency. The vault_doctor tool uses
# stdlib + pyyaml only to stay light. The memory runtime may add pydantic later;
# vault_doctor must not.

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vault-doctor = "modeller_memory.tools.vault_doctor.cli:main"
drieat-import = "modeller_memory.tools.drieat_import.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
